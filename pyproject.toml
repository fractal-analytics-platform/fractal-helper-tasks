# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

# read more about configuring hatch at:
# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
packages = ["src/fractal_helper_tasks"]

# Clean up the source distribution to avoid big tag.gz files
[tool.hatch.build.targets.sdist]
exclude = [
    # Exclude tests from the source distribution
    "tests",
    # Exclude typically large files and directories that are not needed
    # This might not exists or be named differently in your project
    # TBD if we want to include these or not
    "docs",
    "data",
    "examples",
    "notebooks",
    ".github",
    # Remove all jupyter notebook and checkpoints
    "**/*.ipynb_checkpoints",
    "**/*.ipynb",
    # NB all things in .gitignore are excluded by default of hatchling
]

# Project metadata (see https://peps.python.org/pep-0621)
[project]
name = "fractal-helper-tasks"
dynamic = ["version"]
description = "Collection of Fractal helper tasks"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Joel Luethi", email = "joel.luethi@uzh.ch" },
]

# Required Python version and dependencies
requires-python = ">=3.11,<3.14"
dependencies = [
    # TODO: relax to a range (e.g. >=1.1.0,<2.0.0) once ngio 1.1.0 final is out
    "ngio==1.1.0b2",
    "fractal-task-tools>=0.5.0,<0.6.0",
    "scikit-image",
    # ngio>=1.1 requires dask[array]>=2025.12, incompatible with the old
    # dask<2025.11.0 cap (which predated ngio 0.5.10's dask unpin)
    "dask"
]

# Optional dependencies (e.g. for `pip install -e ".[dev]"`, see
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies)
[project.optional-dependencies]
dev = [
    "notebook",
    "devtools",
    "hatch",
    "pytest",
    "pytest-cov",
    "requests",
    "jsonschema",
    "ruff",
    "pre-commit",
    "pooch", 
    "pillow",
]

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

# https://docs.astral.sh/ruff/rules
[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
extend-select = [
    "D417", # Missing argument descriptions in Docstrings
]
ignore = [
    "D401", # First line should be in imperative mood (remove to opt in)
    "C408", # Unnecessary `dict` call
    "D415", # First line should end with a period (remove to opt in)
    "UP022" # Used in validate_command test, waiting for template fix
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 89
skip-magic-trailing-comma = false # default is false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
fractal-helper-tasks = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
install-pre-commit = { cmd = ["pre-commit", "install"] }
format-imports = { cmd = ["ruff", "check", "--select", "I", "--fix"] }
format-code = { cmd = ["ruff", "format", "."] }

create-manifest = { cmd = [
    "fractal-manifest",
    "create",
    "--package",
    "fractal-helper-tasks",
] }

[tool.pixi.feature.dev.tasks]
test = { cmd = ["pytest", "./tests/"] }

init-tasks = [
    { task = "install-pre-commit", environment = "dev" },
    { task = "format-code", environment = "dev" },
    { task = "format-imports", environment = "dev" },
    { task = "create-manifest", environment = "dev" },
    { task = "test", environment = "dev" },
]
